[package]
name = "safety-tool"
version = "0.4.1"
edition = "2024"
autobins = false
authors = ["Artisan-Lab <xuh@fudan.edu.cn>"]
description = "Tag definition toolkit for unsafe APIs in Rust std"
license = "MPL-2.0"
repository = "https://github.com/Artisan-Lab/tag-std"
readme = "README.md"

[features]
default = ["std"]
std = ["dep:safety-lib"]

[dependencies]
safety-lib = { path = "./safety-lib/", version = "0.4.1", optional = true, features = ["std"] }
safety-macro = { path = "./safety-macro/", version = "0.4.1" }
safety-parser = { path = "./safety-parser/", version = "0.4.2" }

[workspace]
members = ["safety-lib", "safety-macro", "safety-parser"]

[package.metadata.rust-analyzer]
rustc_private = false
